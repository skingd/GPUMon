# SNMP Extend configuration for NVIDIA GPU monitoring
#
# The extend directive exposes the script output under:
#   NET-SNMP-EXTEND-MIB::nsExtendOutputFull."nvidia-smi"
#
# ── Linux ──
# Copy this file to /etc/snmp/snmpd.conf.d/ or append to /etc/snmp/snmpd.conf
#
# extend nvidia-smi /usr/bin/python3 /opt/snmp-monitoring/nvidia-gpu-metrics.py
#
# ── Windows (Server 2022 / Windows 11) ──
# Append to C:\usr\etc\snmp\snmpd.conf  (Net-SNMP default)
# Adjust python path to match your installation.
#
# extend nvidia-smi C:\Python312\python.exe C:\snmp-monitoring\nvidia-gpu-metrics.py

# Uncomment the line that matches your OS:

# Linux
#extend nvidia-smi /usr/bin/python3 /opt/snmp-monitoring/nvidia-gpu-metrics.py

# Windows
#extend nvidia-smi C:\Python312\python.exe C:\snmp-monitoring\nvidia-gpu-metrics.py
